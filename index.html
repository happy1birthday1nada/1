<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اي اللينك ده يا ترااا؟ 🎉</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #FF6B9D;
    --orange: #FF8E53;
    --yellow: #FFD166;
    --mint: #06D6A0;
    --purple: #A78BFA;
    --deep-pink: #E91E8C;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Tajawal', sans-serif;
    background: #0a0a1a;
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
    cursor: none;
  }

  /* Custom cursor */
  .cursor {
    width: 20px; height: 20px;
    background: var(--pink);
    border-radius: 50%;
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.1s, width 0.2s, height 0.2s;
    mix-blend-mode: screen;
  }

  /* Animated background */
  .bg-layer {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(255,107,157,0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(167,139,250,0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(6,214,160,0.08) 0%, transparent 60%);
    z-index: 0;
    animation: bgShift 8s ease-in-out infinite alternate;
  }

  @keyframes bgShift {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(30deg); }
  }

  /* Confetti */
  .confetti-wrap {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }

  .dot {
    position: absolute;
    border-radius: 50%;
    animation: rain linear infinite;
    opacity: 0.7;
  }

  @keyframes rain {
    0% { transform: translateY(-20px) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(540deg); }
  }

  /* Main content */
  .page {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }

  /* Hero section */
  .hero {
    text-align: center;
    padding: 3rem 1rem 2rem;
    animation: fadeUp 0.8s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    padding: 0.4rem 1.5rem;
    border-radius: 50px;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 1.2rem;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 20px rgba(255,107,157,0.4); }
    50% { box-shadow: 0 0 40px rgba(255,107,157,0.8), 0 0 60px rgba(167,139,250,0.4); }
  }

  .main-title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(3rem, 10vw, 6rem);
    background: linear-gradient(135deg, var(--pink) 0%, var(--orange) 40%, var(--yellow) 70%, var(--mint) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
    margin-bottom: 0.5rem;
    animation: titleGlow 3s ease-in-out infinite alternate;
  }

  @keyframes titleGlow {
    from { filter: brightness(1); }
    to { filter: brightness(1.3); }
  }

  .subtitle {
    font-size: 1.2rem;
    color: rgba(255,255,255,0.6);
    font-weight: 400;
    margin-bottom: 0.5rem;
  }

  .cake-big {
    font-size: 5rem;
    display: block;
    margin: 1.5rem auto;
    animation: cakeBounce 2s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(255,209,102,0.6));
  }

  @keyframes cakeBounce {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-15px) scale(1.05); }
  }

  /* Message card */
  .msg-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 2rem 2.5rem;
    max-width: 560px;
    width: 100%;
    margin: 1.5rem auto;
    backdrop-filter: blur(20px);
    animation: fadeUp 0.8s 0.2s ease both;
    position: relative;
    overflow: hidden;
  }

  .msg-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,107,157,0.08), rgba(167,139,250,0.08));
    border-radius: 24px;
  }

  .msg-card::after {
    content: '';
    position: absolute;
    top: -1px; left: 10%; right: 10%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--pink), var(--purple), transparent);
  }

  .msg-icon {
    font-size: 1.8rem;
    margin-bottom: 1rem;
    display: block;
  }

  .msg-text {
    font-size: 1.25rem;
    line-height: 1.9;
    color: rgba(255,255,255,0.9);
    font-weight: 500;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  /* Gallery */
  .gallery-section {
    width: 100%;
    max-width: 700px;
    margin: 2rem auto;
    animation: fadeUp 0.8s 0.4s ease both;
  }

  .section-title {
    text-align: center;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--pink);
    margin-bottom: 1.5rem;
    text-transform: uppercase;
  }

  .gallery-btn {
    display: block;
    margin: 0 auto 1.5rem;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    color: white;
    border: none;
    border-radius: 50px;
    padding: 0.9rem 2.5rem;
    font-size: 1rem;
    font-weight: 800;
    font-family: 'Tajawal', sans-serif;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 30px rgba(255,107,157,0.3);
  }

  .gallery-btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 8px 40px rgba(255,107,157,0.6);
  }

  .gallery {
    display: none;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    padding: 10px;
  }

  .gallery.open { display: flex; }

  .gallery img {
    width: 140px;
    height: 140px;
    object-fit: cover;
    border-radius: 16px;
    border: 2px solid rgba(255,255,255,0.1);
    opacity: 0;
    transform: scale(0.8) rotate(-3deg);
    animation: imgPop 0.4s ease forwards;
    transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
  }

  .gallery img:hover {
    transform: scale(1.08) rotate(0deg) !important;
    border-color: var(--pink);
    box-shadow: 0 8px 30px rgba(255,107,157,0.4);
    z-index: 5;
  }

  @keyframes imgPop {
    to { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  /* Wishes */
  .wishes-section {
    max-width: 600px;
    width: 100%;
    margin: 2rem auto;
    animation: fadeUp 0.8s 0.6s ease both;
  }

  .wishes-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }

  .wish-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 50px;
    color: white;
    padding: 0.75rem 1.8rem;
    font-size: 1rem;
    font-family: 'Tajawal', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
    backdrop-filter: blur(10px);
  }

  .wish-btn:hover {
    background: linear-gradient(135deg, var(--pink), var(--purple));
    border-color: transparent;
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(255,107,157,0.4);
  }

  /* Popup */
  .popup-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(10px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 100;
    animation: fadeIn 0.3s ease;
  }

  .popup-overlay.open { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .popup-box {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    border: 1px solid rgba(255,107,157,0.3);
    border-radius: 28px;
    padding: 2.5rem;
    max-width: 340px;
    width: 90%;
    text-align: center;
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(255,107,157,0.15);
  }

  @keyframes popIn {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .popup-emoji { font-size: 3rem; display: block; margin-bottom: 1rem; }

  .popup-name {
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--pink);
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  .popup-text {
    font-size: 1.4rem;
    font-weight: 700;
    color: white;
    line-height: 1.6;
    margin-bottom: 1.5rem;
  }

  .popup-close {
    background: linear-gradient(135deg, var(--pink), var(--deep-pink));
    color: white;
    border: none;
    border-radius: 50px;
    padding: 0.7rem 2rem;
    font-size: 1rem;
    font-family: 'Tajawal', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s;
  }

  .popup-close:hover { transform: scale(1.05); }

  /* Floating hearts */
  .heart {
    position: fixed;
    pointer-events: none;
    animation: floatUp 4s linear infinite;
    z-index: 3;
    font-size: 1.2rem;
    opacity: 0;
  }

  @keyframes floatUp {
    0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.6; }
    100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
  }

  /* Footer */
  .footer {
    margin-top: 3rem;
    text-align: center;
    color: rgba(255,255,255,0.3);
    font-size: 0.85rem;
    letter-spacing: 1px;
  }

  .footer span {
    background: linear-gradient(135deg, var(--pink), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 700;
  }

  /* Photo popup */
  .photo-popup {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 200;
    cursor: pointer;
  }

  .photo-popup.open { display: flex; }

  .photo-popup img {
    max-width: 90vw;
    max-height: 90vh;
    border-radius: 16px;
    border: 2px solid var(--pink);
    box-shadow: 0 0 60px rgba(255,107,157,0.3);
  }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="bg-layer"></div>
<div class="confetti-wrap" id="confetti"></div>

<div class="popup-overlay" id="popup">
  <div class="popup-box">
    <span class="popup-emoji" id="popupEmoji">💖</span>
    <p class="popup-name" id="popupName">من</p>
    <p class="popup-text" id="popupText"></p>
    <button class="popup-close" onclick="closePopup()">إغلاق ✕</button>
  </div>
</div>

<div class="photo-popup" id="photoPopup" onclick="closePhoto()">
  <img id="photoFull" src="" alt="">
</div>

<div class="page">

  <div class="hero">
    <span class="badge">🎂 Happy Birthday 🎂</span>
    <h1 class="main-title">22nd Birthday</h1>
    <p class="subtitle">عيد ميلاد سعيد يا ندي 🌟</p>
    <span class="cake-big">🎂</span>
  </div>

  <div class="msg-card">
    <span class="msg-icon">💬</span>
    <p class="msg-text">كل سنة وانتي اجدع بنت وصاحبة في حياتنا 💛<br>وتدومي لينا العمر كله مع بعض 🌸</p>
  </div>

  <div class="gallery-section">
    <p class="section-title">📸 ذكريات جميلة</p>
    <button class="gallery-btn" onclick="toggleGallery()">اعرضي الصور 📸</button>
    <div class="gallery" id="gallery">
      <img src="nada (1).jpeg" onclick="openPhoto(this)">
      <img src="nada (2).jpeg" onclick="openPhoto(this)" style="animation-delay:0.05s">
      <img src="nada (3).jpeg" onclick="openPhoto(this)" style="animation-delay:0.1s">
      <img src="nada (4).jpeg" onclick="openPhoto(this)" style="animation-delay:0.15s">
      <img src="nada (5).jpeg" onclick="openPhoto(this)" style="animation-delay:0.2s">
      <img src="nada (6).jpeg" onclick="openPhoto(this)" style="animation-delay:0.25s">
      <img src="nada (7).jpeg" onclick="openPhoto(this)" style="animation-delay:0.3s">
      <img src="nada (8).jpeg" onclick="openPhoto(this)" style="animation-delay:0.35s">
      <img src="nada (9).jpeg" onclick="openPhoto(this)" style="animation-delay:0.4s">
      <img src="nada (10).jpeg" onclick="openPhoto(this)" style="animation-delay:0.45s">
      <img src="nada (11).jpeg" onclick="openPhoto(this)" style="animation-delay:0.5s">
      <img src="nada (12).jpeg" onclick="openPhoto(this)" style="animation-delay:0.55s">
      <img src="nada (13).jpeg" onclick="openPhoto(this)" style="animation-delay:0.6s">
      <img src="nada (14).jpeg" onclick="openPhoto(this)" style="animation-delay:0.65s">
      <img src="nada (15).jpeg" onclick="openPhoto(this)" style="animation-delay:0.7s">
      <img src="nada (16).jpeg" onclick="openPhoto(this)" style="animation-delay:0.75s">
      <img src="nada (17).jpeg" onclick="openPhoto(this)" style="animation-delay:0.8s">
      <img src="nada (18).jpeg" onclick="openPhoto(this)" style="animation-delay:0.85s">
      <img src="nada (19).jpeg" onclick="openPhoto(this)" style="animation-delay:0.9s">
      <img src="nada (20).jpeg" onclick="openPhoto(this)" style="animation-delay:0.95s">
 </div>
  </div>

  <div class="wishes-section">
    <p class="section-title">💌 تهاني من الصحاب</p>
    <div class="wishes-grid">
      <button class="wish-btn" onclick="showPopup('فيولا','كل سنة و انتي طيبة يا أجمل ندووش ♥️😍\nبحبك بجد بكل شقاوتك و جرأتك و لذاذتك و قلة أدبك 😉😂💕\nو بحب حضنك اللي بيهون عني دايماً 🥹\nربنا يخليكي ليا و تفضلي منورة حياتي كده 🤍✨','💕')">فيولا 💕</button>
      <button class="wish-btn" onclick="showPopup('خلود','هــابي بيرثداي يا ندوده 🥳❤️ يا أجمد وألذ واحدة، يارب نفضل نهزر ونضحك كده علطول مع بعض ويارب تتجوزى ف العجمى بقا 😂🤍','🥳')">خلود 🥳</button>
    </div>
  </div>

</div>

<audio id="sound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3" preload="auto"></audio>

<script>
  // Custom cursor
  const cursor = document.getElementById('cursor');
  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
  });
  document.querySelectorAll('button, img').forEach(el => {
    el.addEventListener('mouseenter', () => {
      cursor.style.width = '40px';
      cursor.style.height = '40px';
    });
    el.addEventListener('mouseleave', () => {
      cursor.style.width = '20px';
      cursor.style.height = '20px';
    });
  });

  // Confetti
  const colors = ['#FF6B9D','#FF8E53','#FFD166','#06D6A0','#A78BFA','#F472B6','#34D399'];
  const confWrap = document.getElementById('confetti');
  for (let i = 0; i < 50; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    const size = Math.random() * 10 + 5;
    d.style.cssText = `
      left: ${Math.random()*100}vw;
      width: ${size}px; height: ${size}px;
      background: ${colors[Math.floor(Math.random()*colors.length)]};
      animation-duration: ${Math.random()*6+4}s;
      animation-delay: ${Math.random()*6}s;
      border-radius: ${Math.random()>0.5?'50%':'3px'};
    `;
    confWrap.appendChild(d);
  }

  // Floating hearts
  const heartEmojis = ['💖','💗','💓','✨','🌸','⭐','💕'];
  setInterval(() => {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = heartEmojis[Math.floor(Math.random()*heartEmojis.length)];
    h.style.left = Math.random()*100 + 'vw';
    h.style.animationDuration = (Math.random()*3+3) + 's';
    h.style.animationDelay = '0s';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 6000);
  }, 800);

  // Gallery
  function toggleGallery() {
    const g = document.getElementById('gallery');
    const isOpen = g.classList.contains('open');
    if (!isOpen) {
      g.classList.add('open');
      document.querySelector('.gallery-btn').textContent = 'إخفاء الصور 🙈';
      try { document.getElementById('sound').play(); } catch(e){}
    } else {
      g.classList.remove('open');
      document.querySelector('.gallery-btn').textContent = 'اعرضي الصور 📸';
    }
  }

  // Photo popup
  function openPhoto(img) {
    document.getElementById('photoFull').src = img.src;
    document.getElementById('photoPopup').classList.add('open');
  }
  function closePhoto() {
    document.getElementById('photoPopup').classList.remove('open');
  }

  // Wish popup
  function showPopup(name, text, emoji) {
    document.getElementById('popupName').textContent = 'من ' + name;
    document.getElementById('popupText').textContent = text;
    document.getElementById('popupEmoji').textContent = emoji;
    document.getElementById('popup').classList.add('open');
    launchFireworks();
  }
  function closePopup() {
    document.getElementById('popup').classList.remove('open');
  }

  // Fireworks burst on popup
  function launchFireworks() {
    for (let i = 0; i < 20; i++) {
      const fw = document.createElement('div');
      fw.style.cssText = `
        position: fixed;
        width: ${Math.random()*8+4}px; height: ${Math.random()*8+4}px;
        background: ${colors[Math.floor(Math.random()*colors.length)]};
        border-radius: 50%;
        left: ${Math.random()*100}vw;
        top: ${Math.random()*100}vh;
        z-index: 99;
        pointer-events: none;
        animation: fwPop 0.8s ease forwards;
      `;
      document.body.appendChild(fw);
      setTimeout(() => fw.remove(), 900);
    }
  }

  const style = document.createElement('style');
  style.textContent = `
    @keyframes fwPop {
      0% { transform: scale(0); opacity: 1; }
      100% { transform: scale(3); opacity: 0; }
    }
  `;
  document.head.appendChild(style);
</script>
</body>
</html>
